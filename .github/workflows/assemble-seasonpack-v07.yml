name: Assemble SeasonPack v0.7

on:
  push:
    branches: ["feature/season-pack-loader-1980"]
    paths:
      - ".github/workflows/assemble-seasonpack-v07.yml"
      - ".tmp-seasonpack-payload/**"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct byte-identical payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/season-packs/1980
          cat \
            .tmp-seasonpack-payload/v2-part-00 \
            .tmp-seasonpack-payload/v2-part-01 \
            .tmp-seasonpack-payload/v2-part-02 \
            .tmp-seasonpack-payload/v2-part-03 \
            .tmp-seasonpack-payload/v2-part-04 \
            .tmp-seasonpack-payload/v3-part-05-a \
            .tmp-seasonpack-payload/v3-part-05-b \
            .tmp-seasonpack-payload/v3-part-05-c \
            .tmp-seasonpack-payload/v3-part-05-d \
            | base64 -d | gzip -dc \
            > data/season-packs/1980/season-pack-1980.v0.7.json
          echo "df563cbf163e41e749fd096035b3c013a6607ee335be91e798082de13db5dc36  data/season-packs/1980/season-pack-1980.v0.7.json" | sha256sum -c -
      - name: Patch loader compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/data/seasonPackLoader.js')
          text = path.read_text()
          old_staff = '''function staffMatches(assignment, row) {
            return assignment?.staff_id === row?.staff_id && assignment?.team_id === row?.team_id
              && (!assignment?.role || assignment.role === row?.role);
          }'''
          new_staff = '''function staffMatches(assignment, row) {
            return assignment?.staff_id === row?.staff_id
              && (!row?.team_id || assignment?.team_id === row.team_id)
              && (!row?.role || !assignment?.role || assignment.role === row.role);
          }'''
          if old_staff not in text:
              raise SystemExit('Expected staffMatches implementation was not found.')
          text = text.replace(old_staff, new_staff, 1)
          old_source = 'sourcePackage: { databaseVersion, packageVersion: payload.version ?? null, packageType: payload.type, season,'
          new_source = 'sourcePackage: { databaseVersion, version: payload.version ?? null, packageVersion: payload.version ?? null, packageType: payload.type, season,'
          if old_source not in text:
              raise SystemExit('Expected sourcePackage implementation was not found.')
          path.write_text(text.replace(old_source, new_source, 1))
          PY
      - name: Validate SeasonPack integration
        shell: bash
        run: |
          set -euo pipefail
          npm test
      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/seasonPackLoader.js data/season-packs/1980/season-pack-1980.v0.7.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(data): finalize Season Pack 1980 v0.7 integration"
          git push origin HEAD:feature/season-pack-loader-1980
