name: CI

on:
  push:
    branches: [main, "phase-*", "feature-*", "data-*"]
  pull_request:

jobs:
  simulation-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run simulation tests
        run: npm test

  database-tooling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run database tooling tests
        run: python -m unittest discover -s tools/db/tests -v
